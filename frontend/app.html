<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTN — My Dashboard</title>
  <meta name="description" content="Your solar carbon credit dashboard. Track generation, monitor credits earned, and sell when you reach the threshold.">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2eb; --bg2: #eceadf; --card: #ffffff;
      --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.06);
      --text: #1a1a16; --text2: #6b6b5e; --text3: #9e9e8f;
      --green: #2d6a4f; --green-light: #d8f3dc; --green-mid: #52b788;
      --amber: #b5451b; --amber-light: #fde8d8;
      --blue: #1d4e89; --blue-light: #dbeafe;
      --red: #b91c1c; --red-light: #fee2e2;
      --mono: 'DM Mono', monospace; --serif: 'Fraunces', serif;
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

    /* NAV */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      background: var(--bg); position: sticky; top: 0; z-index: 100;
    }
    .nav-left { display: flex; align-items: center; gap: 10px; }
    .nav-logo { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
    .nav-logo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green-mid); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.6; transform:scale(1.2); } }
    .nav-links { display: flex; gap: 4px; }
    .nav-link { font-size: 12px; padding: 0.4rem 0.75rem; border-radius: var(--radius-sm); color: var(--text2); text-decoration: none; transition: all 0.15s; }
    .nav-link:hover { color: var(--text); background: var(--bg2); }
    .nav-link.active { color: var(--text); background: var(--bg2); }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .nav-user { font-size: 11px; color: var(--text3); }
    .btn-sm { font-size: 11px; padding: 0.35rem 0.75rem; border-radius: var(--radius-sm); font-family: var(--mono); cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
    .btn-sm:hover { color: var(--text); border-color: var(--text3); }

    /* MAIN */
    .main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

    /* GREETING */
    .greeting { margin-bottom: 1.5rem; }
    .greeting-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 0.35rem; }
    .greeting h1 { font-family: var(--serif); font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 300; line-height: 1.15; letter-spacing: -0.02em; }
    .greeting h1 em { font-style: italic; color: var(--green); }

    /* WALLET NOTICE */
    .notice { border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 12px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; line-height: 1.4; }
    .notice-amber { background: var(--amber-light); border: 1px solid rgba(181,69,27,0.2); color: var(--amber); }
    .notice-green { background: var(--green-light); border: 1px solid rgba(45,106,79,0.2); color: var(--green); }
    .notice a { color: inherit; font-weight: 500; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
    .stat-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.1rem; transition: border-color 0.2s; }
    .stat-card:hover { border-color: var(--border); }
    .stat-label { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3); margin-bottom: 0.4rem; }
    .stat-value { font-family: var(--serif); font-size: 1.75rem; font-weight: 300; line-height: 1; color: var(--text); margin-bottom: 0.15rem; }
    .stat-value.green { color: var(--green); }
    .stat-value.amber { color: var(--amber); }
    .stat-unit { font-size: 10px; color: var(--text3); }

    /* SELL THRESHOLD */
    .threshold-card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; }
    .threshold-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
    .threshold-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; }
    .threshold-status { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .threshold-status.eligible { background: var(--green-light); color: var(--green); }
    .threshold-status.pending { background: var(--amber-light); color: var(--amber); }
    .progress-track { background: var(--bg2); border-radius: var(--radius-sm); height: 10px; overflow: hidden; margin-bottom: 0.5rem; }
    .progress-fill { height: 100%; background: var(--green-mid); border-radius: var(--radius-sm); transition: width 1s ease; }
    .progress-label { font-size: 11px; color: var(--text2); }
    .btn-sell { padding: 0.6rem 1.5rem; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px; font-weight: 500; cursor: pointer; border: none; background: var(--green); color: white; transition: opacity 0.2s; margin-top: 0.75rem; }
    .btn-sell:hover { opacity: 0.85; }
    .btn-sell:disabled { opacity: 0.35; cursor: not-allowed; }
    .sell-note { font-size: 11px; color: var(--text3); margin-top: 0.5rem; }

    /* CREDITS TABLE */
    .card { background: var(--card); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .card-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); }
    .credit-item { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px solid var(--border2); font-size: 12px; }
    .credit-item:last-child { border-bottom: none; }
    .credit-id { font-size: 10px; color: var(--text3); margin-bottom: 2px; }
    .credit-kwh { font-weight: 500; color: var(--text); }
    .credit-co2 { font-size: 11px; color: var(--text2); }
    .badge { font-size: 9px; padding: 2px 8px; border-radius: 20px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-verified { background: var(--green-light); color: var(--green); }
    .badge-pending { background: var(--amber-light); color: var(--amber); }
    .badge-listed { background: var(--blue-light); color: var(--blue); }
    .badge-sold { background: #f0fdf4; color: #166534; }
    .badge-retired { background: var(--bg2); color: var(--text3); }
    .badge-reserved { background: #fef3c7; color: #92400e; }

    /* PAGINATION */
    .pagination { display: flex; gap: 8px; align-items: center; margin-top: 0.75rem; }
    .btn-page { font-size: 11px; padding: 0.35rem 0.75rem; border-radius: var(--radius-sm); font-family: var(--mono); cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); transition: all 0.15s; }
    .btn-page:hover:not(:disabled) { color: var(--text); border-color: var(--text3); }
    .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-info { font-size: 10px; color: var(--text3); }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 3rem 1rem; }
    .empty-icon { font-size: 2rem; margin-bottom: 0.75rem; opacity: 0.5; }
    .empty-title { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; margin-bottom: 0.5rem; }
    .empty-desc { font-size: 12px; color: var(--text2); max-width: 300px; margin: 0 auto; line-height: 1.5; }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 1.25rem 1.5rem; font-size: 10px; color: var(--text3); text-align: center; }

    /* SELL MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; padding: 1.5rem; }
    .modal-overlay.visible { display: flex; }
    .modal { background: var(--card); border-radius: var(--radius); padding: 1.5rem; max-width: 420px; width: 100%; max-height: 80vh; overflow-y: auto; }
    .modal-title { font-family: var(--serif); font-size: 1.25rem; font-weight: 400; margin-bottom: 0.5rem; }
    .modal-desc { font-size: 12px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.5; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
    .btn-cancel { padding: 0.5rem 1rem; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text2); }

    /* DEVICES */
    .device-item { display: flex; align-items: center; justify-content: space-between; padding: 0.65rem 0; border-bottom: 1px solid var(--border2); font-size: 12px; }
    .device-item:last-child { border-bottom: none; }
    .device-id { font-weight: 500; }
    .device-meta { font-size: 11px; color: var(--text2); }

    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease forwards; }
    .fade-up-2 { animation-delay: 0.1s; opacity: 0; }
    .fade-up-3 { animation-delay: 0.2s; opacity: 0; }
    .fade-up-4 { animation-delay: 0.3s; opacity: 0; }

    /* LOADING SKELETON */
    .skeleton { background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* MOBILE */
    @media (max-width: 600px) {
      .nav-links { display: none; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    .sig-chip { margin-left: 8px; font-size: 10px; color: var(--green); background: var(--green-light); padding: 2px 6px; border-radius: 4px; text-decoration: none; display: inline-block; }
    .sig-chip-plain { color: var(--text3); background: var(--bg2); }
    .list-empty { font-size: 12px; color: var(--text3); padding: 1rem 0; }
    .device-add { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .device-add-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 0.4rem; }
    .device-add-help { font-size: 11px; color: var(--text2); line-height: 1.5; margin-bottom: 0.6rem; }
    .device-add-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .device-add-row input { flex: 1 1 160px; }
    .device-add input { width: 100%; padding: 0.5rem 0.7rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 12px; background: var(--bg); color: var(--text); }
    .device-result { font-size: 11px; margin-top: 0.5rem; line-height: 1.5; }
    .device-result.ok { color: var(--green); }
    .device-result.err { color: var(--red); }
  </style>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a href="/" class="nav-logo"><div class="nav-logo-dot"></div> CTN</a>
      <div class="nav-links">
        <a href="/app" class="nav-link active">Dashboard</a>
        <a href="/app/history" class="nav-link">History</a>
        <a href="/profile" class="nav-link">Account</a>
      </div>
    </div>
    <div class="nav-right">
      <span class="nav-user" id="nav-user">—</span>
      <button class="btn-sm" onclick="logout()" id="logout-btn">Sign out</button>
    </div>
  </nav>

  <div class="main" id="main-content">
    <!-- Content loads dynamically -->
    <div class="greeting fade-up">
      <p class="greeting-label">Installer Dashboard</p>
      <h1 id="greeting-title">Loading<br>your <em>dashboard...</em></h1>
    </div>
    <div class="stats-grid fade-up fade-up-2">
      <div class="stat-card"><div class="skeleton" style="height:20px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:36px;width:80%;"></div></div>
      <div class="stat-card"><div class="skeleton" style="height:20px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:36px;width:80%;"></div></div>
      <div class="stat-card"><div class="skeleton" style="height:20px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:36px;width:80%;"></div></div>
      <div class="stat-card"><div class="skeleton" style="height:20px;width:60%;margin-bottom:8px;"></div><div class="skeleton" style="height:36px;width:80%;"></div></div>
    </div>
  </div>

  <!-- SELL MODAL -->
  <div class="modal-overlay" id="sell-modal">
    <div class="modal">
      <div class="modal-title">List credits for sale</div>
      <div class="modal-desc" id="sell-modal-desc">Select which verified credits to list on the marketplace.</div>
      <div id="sell-modal-body"></div>
      <div id="sell-error" class="error-msg" style="display:none;background:var(--red-light);border:1px solid rgba(185,28,28,0.2);border-radius:var(--radius-sm);padding:0.65rem;font-size:12px;color:var(--red);margin-top:0.75rem;"></div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeSellModal()">Cancel</button>
        <button class="btn-sell" id="sell-confirm-btn" onclick="confirmSell()">List for sale →</button>
      </div>
    </div>
  </div>

  <footer>CTN · Climate Trust Network · Simulated data from Patna, Bihar, India</footer>

  <script src="/static/ctn.js"></script>
  <script src="/static/wallet.js"></script>
  <script>
    const PAGE_SIZE = 10;
    const esc = CTN.fmt.escape;

    const state = {
      user: null,
      settings: null,
      dashboard: null,
      credits: { data: null, page: 1 },
      readings: { data: null, page: 1 },
    };

    function logout() { CTN.logout(); }

    // ── Init ──

    async function init() {
      const user = await CTN.requireRole('installer', '/app');
      if (!user) return;

      state.user = user;
      document.getElementById('nav-user').textContent = user.email;

      try {
        const [settings, dashboard, credits, readings] = await Promise.all([
          CTN.settings(),
          CTN.get('/api/installer/dashboard'),
          CTN.get(`/api/installer/credits?page=1&limit=${PAGE_SIZE}`),
          CTN.get(`/api/installer/readings?page=1&limit=${PAGE_SIZE}`),
        ]);

        state.settings = settings;
        state.dashboard = dashboard;
        state.credits = { data: credits, page: 1 };
        state.readings = { data: readings, page: 1 };

        renderDashboard();
      } catch (e) {
        console.error('Dashboard load failed:', e);
        document.getElementById('main-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠</div>
            <div class="empty-title">Could not load your dashboard</div>
            <div class="empty-desc">${esc(e.message || 'Please refresh and try again.')}</div>
          </div>`;
      }
    }

    // ── Render ──

    function renderDashboard() {
      const { stats, sell_threshold: threshold, installer, credits_by_status: byStatus } = state.dashboard;
      const pricePerCredit = state.dashboard.pricing.price_per_credit_inr;
      const hasData = stats.total_credits > 0;

      let html = `
        <div class="greeting fade-up">
          <p class="greeting-label">Installer Dashboard · ${esc(installer.email)}</p>
          <h1>${hasData
            ? `${CTN.fmt.number(stats.total_kwh)} kWh<br>of <em>clean energy.</em>`
            : `Welcome to<br><em>CTN.</em>`}</h1>
        </div>`;

      if (!installer.wallet_linked) {
        html += `<div class="notice notice-amber fade-up" id="wallet-notice">
          Your credits are held in CTN custody.
          <a href="#" onclick="linkWallet(event)">Link your wallet</a>
          to take ownership and enable selling.
        </div>`;
      }

      if (!hasData) {
        html += `
          <div class="empty-state fade-up fade-up-2" style="padding:4rem 1rem;">
            <div class="empty-icon">☀</div>
            <div class="empty-title">No data yet</div>
            <div class="empty-desc">Your device is registered. Credits appear here as generation data arrives.</div>
          </div>`;
        document.getElementById('main-content').innerHTML = html;
        return;
      }

      html += `
        <div class="stats-grid fade-up fade-up-2">
          <div class="stat-card">
            <div class="stat-label">Energy generated</div>
            <div class="stat-value">${CTN.fmt.number(stats.total_kwh)}</div>
            <div class="stat-unit">kilowatt-hours</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">CO₂ avoided</div>
            <div class="stat-value green">${CTN.fmt.number(stats.total_co2_kg)}</div>
            <div class="stat-unit">kilograms (${stats.total_co2_tonnes} t)</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Credits earned</div>
            <div class="stat-value">${CTN.fmt.number(stats.total_credits)}</div>
            <div class="stat-unit">carbon credits</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Estimated value</div>
            <div class="stat-value amber">${CTN.fmt.inr(stats.value_inr)}</div>
            <div class="stat-unit">${CTN.fmt.usd(stats.value_usd)} USD</div>
          </div>
        </div>`;

      const badge = threshold.eligible
        ? '<span class="threshold-status eligible">Ready to sell</span>'
        : `<span class="threshold-status pending">${threshold.remaining} more to go</span>`;

      html += `
        <div class="threshold-card fade-up fade-up-3">
          <div class="threshold-header">
            <div class="threshold-title">Sell threshold</div>
            ${badge}
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${Math.min(100, threshold.progress_pct)}%"></div>
          </div>
          <div class="progress-label">
            ${threshold.eligible
              ? `${threshold.current} verified credit(s) available to list`
              : `${threshold.current} of ${threshold.required} verified credits · ${threshold.progress_pct}% complete`}
          </div>
          ${threshold.eligible
            ? `<button class="btn-sell" onclick="${installer.wallet_linked ? 'openSellModal()' : 'linkWallet(event)'}">
                 ${installer.wallet_linked ? 'List credits for sale →' : 'Link wallet to sell'}
               </button>`
            : `<div class="sell-note">Earn ${threshold.remaining} more verified credit(s) to unlock selling.</div>`}
        </div>`;

      html += `
        <div class="card fade-up fade-up-3">
          <div class="card-header"><div class="card-title">Credit status breakdown</div></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;">
            ${statusTile('Verified', byStatus.verified)}
            ${statusTile('Listed', byStatus.listed + byStatus.reserved)}
            ${statusTile('Sold / Retired', byStatus.sold + byStatus.retired)}
          </div>
        </div>

        <div class="notice notice-blue fade-up fade-up-3" style="margin-bottom:2rem;">
          <strong>Your generation data accumulates into credits</strong> — every
          ${CTN.fmt.number(state.settings.kg_co2_per_credit)} kg (1 metric tonne) of CO₂
          avoided becomes one sellable carbon credit, priced at ${CTN.fmt.inr(pricePerCredit)}.
        </div>

        ${paginatedCard('readings', 'Generation History')}
        ${paginatedCard('credits', 'Sellable Credits (1 tonne each)')}`;

      html += `
        <div class="card fade-up fade-up-4">
          <div class="card-title">Your devices</div>
          ${state.dashboard.devices.length
            ? state.dashboard.devices.map(d => `
                <div class="device-item">
                  <div>
                    <div class="device-id">${esc(d.device_id)}</div>
                    <div class="device-meta">${esc(d.location || 'Unknown location')}</div>
                  </div>
                  <span class="badge badge-verified">Active</span>
                </div>`).join('')
            : '<div class="list-empty">No active devices yet.</div>'}

          <div id="device-requests"></div>

          <div class="device-add">
            <div class="device-add-title">Add a device</div>
            <p class="device-add-help">
              Submit your generation device for review. An administrator verifies it
              before it starts recording — credits have to be traceable to an
              attested device, so this step is not automatic.
            </p>
            <div class="device-add-row">
              <input id="new-device-id" placeholder="Device ID (e.g. INV-2401-7788)">
              <input id="new-device-location" placeholder="Location">
            </div>
            <input id="new-device-notes" placeholder="Anything the reviewer should know (optional)">
            <button class="btn-sell" style="margin-top:0.6rem;" onclick="submitDevice()">
              Submit for review →
            </button>
            <div id="device-result" class="device-result"></div>
          </div>
        </div>`;

      document.getElementById('main-content').innerHTML = html;
      renderReadings();
      renderCredits();
      loadDeviceRequests();
    }

    function statusTile(label, value) {
      return `
        <div style="padding:0.5rem;background:var(--bg2);border-radius:var(--radius-sm);text-align:center;">
          <div style="font-family:var(--serif);font-size:1.25rem;font-weight:300;">${value}</div>
          <div style="font-size:10px;color:var(--text3);">${label}</div>
        </div>`;
    }

    function paginatedCard(key, title) {
      return `
        <div class="card fade-up fade-up-4">
          <div class="card-header">
            <div class="card-title">${title}</div>
            <div class="page-info" id="${key}-page-info"></div>
          </div>
          <div id="${key}-list"></div>
          <div class="pagination">
            <button class="btn-page" onclick="changePage('${key}', -1)" id="${key}-prev-btn">← prev</button>
            <button class="btn-page" onclick="changePage('${key}', 1)" id="${key}-next-btn">next →</button>
          </div>
        </div>`;
    }

    function renderReadings() {
      const { data, page } = state.readings;
      const list = document.getElementById('readings-list');
      if (!list) return;

      list.innerHTML = data.readings.length ? data.readings.map(r => `
        <div class="credit-item">
          <div>
            <div class="credit-id">Reading ${esc(r.reading_id)} · ${esc((r.timestamp || '').slice(0, 16))}</div>
            <div class="credit-kwh">
              ${(r.total_kwh || 0).toFixed(2)} kWh generated
              ${r.attested
                ? `<a class="sig-chip" href="${CTN.API}/api/v1/readings/${encodeURIComponent(r.reading_id)}/proof"
                      target="_blank" rel="noopener"
                      title="Signed by the device. Click to verify independently.">⛨ attested #${r.sequence}</a>`
                : `<span class="sig-chip sig-chip-plain" title="Imported rather than signed by a device — its origin rests on the operator who uploaded it.">imported</span>`}
            </div>
          </div>
          <span class="credit-co2">+${(r.co2_avoided_kg || 0).toFixed(1)} kg CO₂</span>
        </div>`).join('')
        : '<div class="list-empty">No readings recorded yet.</div>';

      updatePager('readings', page, data.pages || 1);
    }

    function renderCredits() {
      const { data, page } = state.credits;
      const list = document.getElementById('credits-list');
      if (!list) return;

      list.innerHTML = data.credits.length ? data.credits.map(c => `
        <div class="credit-item">
          <div>
            <div class="credit-id">Credit #${c.credit_id} · ${CTN.fmt.date(c.period_start)} to ${CTN.fmt.date(c.period_end)}</div>
            <div class="credit-kwh">
              ${CTN.fmt.number(c.co2_avoided_kg)} kg CO₂ avoided
              ${c.on_chain_id ? `<span class="sig-chip">⛓ on-chain #${c.on_chain_id}</span>` : ''}
            </div>
          </div>
          <span class="badge badge-${esc(c.status)}">${esc(c.status)}</span>
        </div>`).join('')
        : '<div class="list-empty">No credits accumulated yet.</div>';

      updatePager('credits', page, data.pages || 1);
    }

    function updatePager(key, page, pages) {
      document.getElementById(`${key}-page-info`).textContent = `page ${page} of ${pages}`;
      document.getElementById(`${key}-prev-btn`).disabled = page <= 1;
      document.getElementById(`${key}-next-btn`).disabled = page >= pages;
    }

    async function changePage(key, direction) {
      const entry = state[key];
      const next = entry.page + direction;
      if (next < 1 || next > (entry.data.pages || 1)) return;

      try {
        entry.data = await CTN.get(`/api/installer/${key}?page=${next}&limit=${PAGE_SIZE}`);
        entry.page = next;
        key === 'credits' ? renderCredits() : renderReadings();
      } catch (e) {
        console.error(`Could not load ${key} page ${next}:`, e);
      }
    }

    // ── Device onboarding ──

    async function loadDeviceRequests() {
      const container = document.getElementById('device-requests');
      if (!container) return;

      try {
        const { requests } = await CTN.get('/api/installer/device-requests');
        // Approved requests already appear above as active devices.
        const outstanding = requests.filter(r => r.status !== 'approved');
        if (!outstanding.length) { container.innerHTML = ''; return; }

        container.innerHTML = outstanding.map(r => `
          <div class="device-item">
            <div>
              <div class="device-id">${esc(r.device_id)}</div>
              <div class="device-meta">
                ${esc(r.location || '')}
                ${r.review_note ? ` · ${esc(r.review_note)}` : ''}
              </div>
            </div>
            <span class="badge badge-${r.status === 'pending' ? 'pending' : 'retired'}">
              ${r.status === 'pending' ? 'Awaiting review' : 'Declined'}
            </span>
          </div>`).join('');
      } catch (e) {
        container.innerHTML = '';
      }
    }

    async function submitDevice() {
      const idField = document.getElementById('new-device-id');
      const result = document.getElementById('device-result');

      const device_id = idField.value.trim();
      if (!device_id) {
        result.textContent = 'Enter the device ID printed on your inverter or meter.';
        result.className = 'device-result err';
        return;
      }

      result.textContent = 'Submitting…';
      result.className = 'device-result';

      try {
        const response = await CTN.post('/api/installer/device-requests', {
          device_id,
          location: document.getElementById('new-device-location').value.trim() || 'India',
          notes: document.getElementById('new-device-notes').value.trim(),
        });
        result.textContent = response.message;
        result.className = 'device-result ok';
        idField.value = '';
        document.getElementById('new-device-notes').value = '';
        await loadDeviceRequests();
      } catch (e) {
        result.textContent = e.message;
        result.className = 'device-result err';
      }
    }

    // ── Wallet linking ──

    async function linkWallet(event) {
      if (event) event.preventDefault();

      const notice = document.getElementById('wallet-notice');
      const setNotice = (text) => { if (notice) notice.textContent = text; };

      if (!CTNWallet.isAvailable()) {
        setNotice('No Ethereum wallet detected. Install MetaMask to link an address and enable selling.');
        return;
      }

      setNotice('Check your wallet — approve the connection, then sign the verification message.');
      try {
        const address = await CTNWallet.link();
        setNotice(`Wallet linked: ${address}. Reloading…`);
        await init();
      } catch (e) {
        setNotice(e.message || 'Could not link your wallet. Please try again.');
      }
    }

    // ── Sell flow ──

    function openSellModal() {
      const available = state.dashboard.credits_by_status.verified;
      const price = state.dashboard.pricing.price_per_credit_inr;
      const minimum = state.dashboard.sell_threshold.required;

      document.getElementById('sell-modal-body').innerHTML = `
        <div style="font-size:12px;color:var(--text2);margin-bottom:0.75rem;">
          You have <strong>${available}</strong> verified credit(s) available to list at
          <strong>${CTN.fmt.inr(price)}</strong> each. Minimum listing: ${minimum}.
        </div>
        <div style="background:var(--bg2);border-radius:var(--radius-sm);padding:1rem;font-size:12px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;align-items:center;">
            <span>Credits to list</span>
            <input type="number" id="sell-quantity" min="${minimum}" max="${available}" value="${available}"
                   style="width:80px;text-align:right;padding:4px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);"
                   oninput="updateSellTotal()">
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span>Price per credit</span><span>${CTN.fmt.inr(price)}</span>
          </div>
          <div style="border-top:1px solid var(--border);margin:8px 0;"></div>
          <div style="display:flex;justify-content:space-between;font-weight:500;">
            <span>Total listing value</span><span id="sell-total-value">${CTN.fmt.inr(available * price)}</span>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:0.5rem;">
          Listed credits appear on the marketplace. You receive payment when a buyer completes a purchase.
        </div>`;

      document.getElementById('sell-error').style.display = 'none';
      document.getElementById('sell-modal').classList.add('visible');
    }

    function updateSellTotal() {
      const input = document.getElementById('sell-quantity');
      const available = state.dashboard.credits_by_status.verified;
      const price = state.dashboard.pricing.price_per_credit_inr;

      let quantity = parseInt(input.value, 10) || 0;
      if (quantity > available) { quantity = available; input.value = available; }
      document.getElementById('sell-total-value').textContent = CTN.fmt.inr(quantity * price);
    }

    function closeSellModal() {
      document.getElementById('sell-modal').classList.remove('visible');
    }

    async function confirmSell() {
      const btn = document.getElementById('sell-confirm-btn');
      const errorEl = document.getElementById('sell-error');
      const minimum = state.dashboard.sell_threshold.required;

      const fail = (message) => {
        errorEl.textContent = message;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'List for sale →';
      };

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Listing...';

      try {
        // Fetch the concrete ids rather than trusting the cached count, which
        // may be stale if credits were listed from another session.
        const verified = await CTN.get('/api/installer/credits?page=1&limit=1000&status_filter=verified');
        const ids = verified.credits.map(c => c.id);

        const quantity = parseInt(document.getElementById('sell-quantity').value, 10) || 0;
        if (quantity < minimum || quantity > ids.length) {
          return fail(`Enter a quantity between ${minimum} and ${ids.length}.`);
        }

        await CTN.post('/api/installer/sell', { credit_ids: ids.slice(0, quantity) });
        closeSellModal();
        await init();
      } catch (e) {
        fail(e.message || 'Could not list credits. Please try again.');
      }
    }

    init();
  </script>
</body>
</html>
